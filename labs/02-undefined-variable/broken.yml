---
- name: Render developer application settings
  hosts: lab
  gather_facts: false
  vars:
    lab_dir: "{{ playbook_dir }}/../../.lab-output/02"
    app_port: 8080
  tasks:
    - name: Ensure the lab directory exists
      ansible.builtin.file:
        path: "{{ lab_dir }}"
        state: directory
        mode: '0755'
    - name: Render application configuration
      ansible.builtin.template:
        src: templates/app.conf.j2
        dest: "{{ lab_dir }}/app.conf"
        mode: '0644'
